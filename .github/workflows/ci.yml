name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: Go API — build, vet, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veylo
          POSTGRES_PASSWORD: veylo_local_dev
          POSTGRES_DB: veylo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veylo -d veylo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: services/api/go.sum

      - name: gofmt check
        working-directory: services/api
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Build
        working-directory: services/api
        run: go build ./...

      - name: Vet
        working-directory: services/api
        run: go vet ./...

      - name: Unit tests
        working-directory: services/api
        run: go test ./internal/... -count=1

      - name: Integration tests (real PostgreSQL + Redis)
        working-directory: services/api
        env:
          DATABASE_URL: postgres://veylo:veylo_local_dev@localhost:5432/veylo_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/1
        run: go test ./tests/ -count=1 -timeout 300s -v

      - name: Migrations apply cleanly
        working-directory: services/api
        env:
          DATABASE_URL: postgres://veylo:veylo_local_dev@localhost:5432/veylo_test?sslmode=disable
        run: go run ./cmd/migrate -dir ./migrations

  web:
    name: Web — lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm --filter @veylo/web lint

      - name: Typecheck
        run: pnpm --filter @veylo/web typecheck

      - name: Unit tests (Vitest)
        run: pnpm --filter @veylo/web test

      - name: Build
        run: pnpm --filter @veylo/web build

  e2e:
    name: E2E — Playwright multi-user flows
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veylo
          POSTGRES_PASSWORD: veylo_local_dev
          POSTGRES_DB: veylo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veylo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: services/api/go.sum

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install Playwright browsers
        run: pnpm --filter @veylo/e2e exec playwright install --with-deps chromium

      - name: Start API
        working-directory: services/api
        env:
          DATABASE_URL: postgres://veylo:veylo_local_dev@localhost:5432/veylo?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          STORAGE_PATH: ${{ runner.temp }}/veylo-uploads
        run: |
          go build -o bin/api ./cmd/api
          ./bin/api &
          echo "PID=$!" >> $GITHUB_ENV

      - name: Start Web
        run: |
          pnpm --filter @veylo/web build
          pnpm --filter @veylo/web start &
          echo "WEB_PID=$!" >> $GITHUB_ENV

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && curl -sf -o /dev/null http://localhost:3000/login && break
            sleep 2
          done
          curl -sf http://localhost:8080/healthz
          curl -sf -o /dev/null http://localhost:3000/login

      - name: Run E2E tests
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
